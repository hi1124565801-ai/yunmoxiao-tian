name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  build:
    outputs:
      attempt: ${{ steps.bundle.outputs.attempt }}
      branch_root: ${{ steps.bundle.outputs.branch_root }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Exclude the previous static export from build inputs
        run: |
          if [ -f .github/pages-export.json ]; then
            python -c 'import json; from pathlib import Path; [Path(p).unlink() for p in json.loads(Path(".github/pages-export.json").read_text())]'
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: pnpm run build:github

      - name: Record build attempt
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          branch_root=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type == "legacy" and .source.branch == "main" and .source.path == "/"')
          echo "branch_root=$branch_root" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
          name: portfolio-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # The Pages build record identifies the requested commit. The generated
      # Actions run can be attributed to the previous branch head.
      - name: Wait for branch publishing when enabled
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          if [[ "$(gh api "$repo/pages" --jq .build_type)" == "legacy" ]]; then
            for attempt in {1..90}; do
              status=$(gh api "$repo/pages/builds" --jq '[.[] | select(.commit == env.GITHUB_SHA)][0].status // ""')
              if [[ "$status" == "built" || "$status" == "errored" ]]; then exit 0; fi
              sleep 10
            done
            echo "::error::Branch publishing did not finish before the timeout."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: portfolio-${{ github.run_id }}-${{ needs.build.outputs.attempt }}

  sync-branch:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.branch_root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portfolio-${{ github.run_id }}-${{ needs.build.outputs.attempt }}
          path: ${{ runner.temp }}/pages-artifact
      - name: Keep the branch source in sync with the deployed site
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/pages-export"
          mkdir -p "$export_dir"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$export_dir"
          touch "$export_dir/.nojekyll"
          python .github/scripts/sync-pages.py "$export_dir"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync the published portfolio to the Pages source"
          # A normal fast-forward push cannot replace a newer main branch.
          git push origin HEAD:refs/heads/main
